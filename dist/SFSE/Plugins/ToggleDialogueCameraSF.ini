[Settings]
; Starfield's mapped TogglePOV action is always accepted, including mouse wheel.
; DirectInput fallback scan code. F = 33. Set -1 to disable this fallback.
iKeyboardToggleKey=33
; Starfield gamepad fallback mask. Right Stick Click = 128. Set -1 to disable this fallback.
iGamepadToggleKey=128
; Switch to first person when dialogue opens and third person when it closes.
bAutoToggle=0
